name: Publicar pacote Linux

on:
  push:
    tags:
      - "v*"
permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências do Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Configurar Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Instalar dependências do projeto
        run: npm ci

      - name: Gerar AppImage e pacote Debian
        run: npm run tauri build -- --bundles appimage,deb

      - name: Criar ou atualizar a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --generate-notes --title "Liga de Jogos UEFS $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            src-tauri/target/release/bundle/deb/*.deb \
            --clobber
