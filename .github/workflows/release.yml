name: Publicar release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências do Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev wget
      - name: Configurar Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
        env:
          LAUNCHER_ADMIN_PASSWORD: ${{ secrets.LAUNCHER_ADMIN_PASSWORD || 'lint-only-password' }}

  build-linux:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências do Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev wget
      - name: Configurar Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: npm ci
      - run: npm run tauri icon -- src-tauri/icons/app-icon.png --output src-tauri/icons
      - run: npm run tauri build -- --bundles appimage
        env:
          LAUNCHER_ADMIN_PASSWORD: ${{ secrets.LAUNCHER_ADMIN_PASSWORD }}
      - name: Guardar pacotes Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  build-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configurar Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: npm ci
      - run: npm run tauri icon -- src-tauri/icons/app-icon.png --output src-tauri/icons
      - run: npm run tauri build -- --no-bundle
        env:
          LAUNCHER_ADMIN_PASSWORD: ${{ secrets.LAUNCHER_ADMIN_PASSWORD }}
      - name: Guardar pacotes Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: src-tauri/target/release/liga-jogos-launcher.exe
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-22.04
    needs: [build-linux, build-windows]
    steps:
      - uses: actions/checkout@v4
      - name: Baixar pacotes
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Criar ou atualizar a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --title "Liga de Jogos UEFS $GITHUB_REF_NAME"
          find release-assets -type f -print0 | xargs -0 gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber
